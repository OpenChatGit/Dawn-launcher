name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      title: ${{ steps.set.outputs.title }}
      kind: ${{ steps.set.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: set
        run: |
          base=$(tr -d ' \t\r\n' < VERSION)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${{ github.ref_name }}"
            ver="${ver#v}"
            kind=official
          else
            ver="${base}-dev.${{ github.run_number }}"
            kind=latest
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "title=Dawn $ver" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Launcher version: $ver ($kind)"

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$APP_VERSION"
          cmake --build build --target host --target app_logic

      - name: Package
        run: bash scripts/package-ci.sh windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawn-windows-x64
          path: dist/Dawn-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-22.04
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libx11-dev libcurl4-openssl-dev python3

      - name: Build
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$APP_VERSION"
          cmake --build build-linux --target host --target app_logic

      - name: Package
        run: bash scripts/package-ci.sh linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawn-linux-x64
          path: dist/Dawn-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_KIND: ${{ needs.version.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dawn-windows-x64
          path: release-assets

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dawn-linux-x64
          path: release-assets

      - name: Write release notes
        run: bash scripts/release-notes.sh "$APP_VERSION" "$RELEASE_KIND" release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          name: ${{ needs.version.outputs.title }}
          body_path: release-notes.md
          files: release-assets/*
          generate_release_notes: ${{ needs.version.outputs.kind == 'official' }}
          draft: false
          prerelease: ${{ needs.version.outputs.kind != 'official' }}
          make_latest: ${{ needs.version.outputs.kind == 'official' }}
          fail_on_unmatched_files: true
